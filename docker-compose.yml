services:
  backend:
    build: ./backend
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/library.db
    volumes:
      - library_data:/app/data
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped
    labels:
      - tsdproxy.enable=true
      - tsdproxy.name=library
      - "tsdproxy.port.1=443/https:80/http,tailscale_funnel"

volumes:
  library_data:
