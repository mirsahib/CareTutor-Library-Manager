services:
  backend:
    build: ./backend
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/library.db
    volumes:
      - library_data:/app/data
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - tsdproxy.enable=true
      - tsdproxy.name=care-tutor-library
      - "tsdproxy.port.1=443/https:3001/http,tailscale_funnel"

volumes:
  library_data:

networks:
  coolify:
    external: true