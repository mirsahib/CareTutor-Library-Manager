<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h3 class="h5 mb-0 fw-bold text-primary">
                    <i class="fa-solid" ng-class="{'fa-pen-to-square': vm.isEdit, 'fa-plus-circle': !vm.isEdit}"></i>
                    {{ vm.isEdit ? 'Edit Book' : 'Add New Book' }}
                </h3>
            </div>
            <div class="card-body p-4">

                <!-- Alert for Error Responses -->
                <div class="alert alert-danger" ng-if="vm.errorMessage">
                    <i class="fa-solid fa-circle-exclamation me-1"></i> {{ vm.errorMessage }}
                </div>

                <form name="bookForm" ng-submit="vm.saveBook(bookForm)" novalidate>
                    <!-- Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Book Title <span class="text-danger">*</span></label>
                        <input type="text" id="title" name="title" class="form-control" 
                               ng-class="{'is-invalid': bookForm.title.$touched && bookForm.title.$invalid}" 
                               ng-model="vm.book.title" required placeholder="e.g. To Kill a Mockingbird">
                        <div class="invalid-feedback">Title is required.</div>
                    </div>

                    <!-- Author -->
                    <div class="mb-3">
                        <label for="author" class="form-label fw-semibold">Author <span class="text-danger">*</span></label>
                        <input type="text" id="author" name="author" class="form-control" 
                               ng-class="{'is-invalid': bookForm.author.$touched && bookForm.author.$invalid}" 
                               ng-model="vm.book.author" required placeholder="e.g. Harper Lee">
                        <div class="invalid-feedback">Author is required.</div>
                    </div>

                    <!-- Category -->
                    <div class="mb-3">
                        <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                        <select id="category" name="category" class="form-select" ng-model="vm.book.category" required>
                            <option ng-repeat="cat in vm.categories" value="{{cat}}">{{cat}}</option>
                        </select>
                    </div>

                    <!-- Published Year -->
                    <div class="mb-4">
                        <label for="published_year" class="form-label fw-semibold">
                            Published Year <span class="text-danger">*</span> (1900 – {{ vm.currentYear }})
                        </label>
                        <input type="number" id="published_year" name="published_year" class="form-control" 
                               ng-class="{'is-invalid': bookForm.published_year.$touched && bookForm.published_year.$invalid}" 
                               ng-model="vm.book.published_year" min="1900" max="{{ vm.currentYear }}" required>
                        <div class="invalid-feedback" ng-show="bookForm.published_year.$error.required">Published year is required.</div>
                        <div class="invalid-feedback" ng-show="bookForm.published_year.$error.min || bookForm.published_year.$error.max">
                            Year must be between 1900 and {{ vm.currentYear }}.
                        </div>
                    </div>

                    <!-- Form Buttons -->
                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-secondary" ng-click="vm.cancel()">Cancel</button>
                        <button type="submit" class="btn btn-primary" ng-disabled="bookForm.$invalid || vm.loading">
                            <span ng-if="vm.loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                            <i class="fa-solid fa-floppy-disk me-1" ng-if="!vm.loading"></i> Save Book
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
