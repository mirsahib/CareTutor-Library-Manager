<!DOCTYPE html>
<html lang="en" ng-app="libraryApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Manager</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .card { border-radius: 10px; border: none; }
        .table-hover tbody tr:hover { background-color: rgba(13, 110, 253, 0.04); }
        .badge-status { font-size: 0.85rem; padding: 0.4em 0.7em; }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#!/books">
                <i class="fa-solid fa-book-bookmark me-2"></i> Caretutors Library Manager
            </a>
            <div class="d-flex">
                <a href="#!/books/new" class="btn btn-light btn-sm fw-semibold">
                    <i class="fa-solid fa-plus me-1"></i> Add New Book
                </a>
            </div>
        </div>
    </nav>

    <!-- Main View Container -->
    <main class="container py-4">
        <div ng-view></div>
    </main>

    <!-- AngularJS & Dependencies -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Application Modules & Scripts -->
    <script src="./app.js"></script>
    <script src="./services/book.service.js"></script>
    <script src="./controllers/book-list.controller.js"></script>
    <script src="./controllers/book-form.controller.js"></script>

</body>
</html>
